<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spec Assistant · Ghazal.design</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&family=Space+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 24 24"><path d="M3 10 12 3l9 7v10H3zM9 20v-7h6v7M12 3v-1"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 19V5h7l2 3h9v11z"/></symbol>
    <symbol id="box" viewBox="0 0 24 24"><path d="m12 3 9 5v8l-9 5-9-5V8zM3 8l9 5 9-5m-9 5v8M7.5 5.5l9 5"/></symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path d="M12 2q0 9 9 10-9 1-9 10-1-9-10-10 9-1 10-10z"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="M5 12l4 4L19 6"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18m-12 0v10m6-10v10"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>
  <header class="topbar">
    <div class="top-inner">
      <a class="brand" href="./"><span class="brand-icon"><svg><use href="#logo"/></svg></span><span>Ghazal<span>.design</span></span></a>
      <span class="top-title">Spec Assistant</span>
      <button type="button" class="button outline" id="load-demo"><svg><use href="#folder"/></svg>Load demo</button>
    </div>
  </header>
  <main class="layout">
    <section class="hero" aria-labelledby="page-title">
      <div class="hero-copy">
        <p class="eyebrow">INTERIOR DESIGN WORKSPACE</p>
        <h1 id="page-title">Interior Design<br>Spec Assistant</h1>
        <p>Turn product details into a source-backed specification schedule, ready to review and export.</p>
      </div>
      <div class="hero-visual" role="img" aria-label="Sunlit living room with a curved sofa and walnut coffee table"></div>
    </section>
    <nav aria-label="Project workflow" class="workflow" id="workflow"></nav>
    <div class="workspace">
      <section class="panel main-panel" id="stage" aria-labelledby="stage-heading"></section>
      <aside class="panel summary" aria-labelledby="summary-title">
        <h2 id="summary-title"><svg><use href="#grid"/></svg>Project summary</h2>
        <div id="summary"></div>
      </aside>
    </div>
    <div id="notice" class="notice" role="status" hidden></div>
  </main>
</body>
</html>
